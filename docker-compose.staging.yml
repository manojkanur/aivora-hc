# Staging stack. Mirrors docker-compose.prod.yml so staging exercises the same
# topology, but reads .env.staging and serves staging.aivorahc.com.
# Box: t3.micro-class (2 vCPU / ~900 MB RAM + 2 GB swap).

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env.staging
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 192m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No auth: REDIS_URL in .env.staging has no password, and redis publishes no
    # ports — it is only reachable on the internal compose network.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 64m

  backend:
    build: ./backend
    image: aivora-backend:staging
    restart: unless-stopped
    # Loopback only — nginx proxies /api/ over the internal network.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env.staging
    command: >
      gunicorn app.main:app
      -w 2
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --access-logfile -
      --error-logfile -
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 384m

  worker:
    build: ./backend
    image: aivora-backend:staging
    restart: unless-stopped
    env_file: .env.staging
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=celery,exports,ai,publish
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_started}
    mem_limit: 192m

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend-dark/dist:/usr/share/nginx/html:ro
      - ./nginx/frontend-staging.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt: certbot writes the HTTP-01 challenge into certbot/www
      # and the issued certs into certbot/conf; nginx only reads both.
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    mem_limit: 48m

volumes:
  postgres_data:
