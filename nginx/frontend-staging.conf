# Staging: same shape as frontend.conf, but for staging.aivorahc.com.
# Port 80 answers ACME challenges; everything else goes to canonical HTTPS.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://staging.aivorahc.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name staging.aivorahc.com;

    ssl_certificate     /etc/letsencrypt/live/staging.aivorahc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.aivorahc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Staging must never show up in search results.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver so upstream resolves at request time
    resolver 127.0.0.11 valid=30s;

    # Keep crawlers out even if the header is missed.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Proxy API calls to backend
    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
