# Bootstrap config, used ONLY to answer the Let's Encrypt HTTP-01 challenge
# before any certificate exists. Replaced by frontend-staging.conf once issued.
server {
    listen 80;
    server_name staging.aivorahc.com _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
