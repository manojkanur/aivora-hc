services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aivora_hc
      POSTGRES_USER: aivora
      POSTGRES_PASSWORD: aivora_dev
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivora -d aivora_hc"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      - DATABASE_URL=postgresql+asyncpg://aivora:aivora_dev@postgres:5432/aivora_hc
      - REDIS_URL=redis://redis:6379/0

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      - DATABASE_URL=postgresql+asyncpg://aivora:aivora_dev@postgres:5432/aivora_hc
      - REDIS_URL=redis://redis:6379/0
    volumes: [./backend:/app]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports: ["5173:5173"]
    volumes: [./frontend:/app, /app/node_modules]
    environment:
      - VITE_API_URL=http://localhost:8000

  # frontend-dark runs on the host: cd frontend-dark && npm run dev (port 5174)

volumes:
  postgres_data:
